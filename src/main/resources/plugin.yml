name: YukiElevator
version: ${version}
main: net.azisaba.yukielevator.YukiElevator
description: シンプルなエレベータープラグイン
website: https://github.com/AzisabaNetwork/YukiElevator
author: YukiLeafX
api-version: '1.21'
permissions:
  yukielevator.use:
    default: true
    children:
      yukielevator.up: true
      yukielevator.down: true
  yukielevator.up:
    default: true
  yukielevator.down:
    default: true
